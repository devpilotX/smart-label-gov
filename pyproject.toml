[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlabel-inspector"
version = "0.1.0"
description = "Evidence-led packaged-label screening application"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = [".venv", "build", "dist"]

[tool.black]
line-length = 120
